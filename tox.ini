[flake8]
max-line-length = 100

[tox]
isolated_build = True
env_list = py3-{flake8,unit,mypy}
skipsdist = true

[testenv]
deps =
  flake8
  mock
  mypy
  pytest
  pytest-cov
  black
  isort
  types-mock
  types-PyYAML
  PyYAML
  pyzabbix
  requests_mock
commands =
    flake8: flake8 files
    mypy: mypy --show-error-codes files
    unit: py.test --strict-markers --cov-report=term-missing --cov=zabbix_maintenance files
