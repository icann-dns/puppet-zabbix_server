stages:
  - lint
  - unit

.before_script: &ruby_before
  - ruby -v
  - bundle --version
  - gem --version
  - rm Gemfile.lock || true
  - bundle install --path=${BUNDLE_PATH:-vendor/bundle}

puppet-lint:
  stage: lint
  before_script: *ruby_before
  script:
    - bundle exec rake validate lint

rubocop:
  stage: lint
  before_script: *ruby_before
  script:
    - bundle exec rake rubocop

rspec:
  stage: unit
  before_script: *ruby_before
  script:
    - bundle exec rake spec

.python_template: &python_template
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    paths:
      - .cache/pip
  before_script:
    - pip3 --version
    - pip3 install tox
    # DNSIN-23
    - ~/.local/bin/tox --version

flake8:
  stage: lint
  <<: *python_template
  script:
    - ~/.local/bin/tox -e py3-flake8

mypy:
  stage: lint
  <<: *python_template
  script:
    - ~/.local/bin/tox -e py3-mypy

pytest:
  stage: unit
  <<: *python_template
  script:
   -  ~/.local/bin/tox -e py3-unit
